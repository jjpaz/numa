name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend and ML contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TEST_DATABASE_URL: ''
      DATABASE_URL: ''
      GEMINI_API_KEY: ''
      NUMA_RUN_DAM_REAL_TEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt modal==1.6.4
      - name: Run backend and isolated ML contract tests
        run: python -m pytest backend/tests backend/ml/tests -q
